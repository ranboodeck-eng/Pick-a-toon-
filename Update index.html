<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pick-a-Toon!</title>
<style>
:root{
  --pink:#ff6fa5; --yellow:#ffd23f; --blue:#3fc1ff; --green:#4be36a;
  --purple:#b46bff; --bg:#fff6e9; --card:#ffffff; --text:#3a2e5c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#241c3b; --card:#332a52; --text:#fdf6ff; }
}
:root[data-theme="dark"]{ --bg:#241c3b; --card:#332a52; --text:#fdf6ff; }
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:"Comic Sans MS","Trebuchet MS",sans-serif;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.wrap{max-width:480px; width:100%; text-align:center;}
h1{font-size:2.2rem; margin:0 0 4px;}
p.sub{margin:0 0 20px; opacity:.85;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.opt{
  border:none; border-radius:18px; padding:20px 10px; font-size:1.1rem;
  font-weight:bold; color:#fff; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.15);
  transition:transform .1s;
}
.opt:active{transform:scale(.95);}
.opt span{display:block; font-size:2rem; margin-bottom:6px;}
.o1{background:var(--pink);} .o2{background:var(--blue);}
.o3{background:var(--green);} .o4{background:var(--purple);}
.o5{background:var(--yellow); color:#3a2e5c; grid-column:1/3;}
.card{
  background:var(--card); border-radius:20px; padding:28px 20px;
